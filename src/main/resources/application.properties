spring.application.name=rag-demo
server.port=8080

# Ollama Configuration (for Mistral)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.model=mistral
spring.ai.ollama.embedding.options.model=mistral
# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=changeme

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rag-demo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Vector Store Configuration - Chroma
spring.ai.vectorstore.chroma.url=http://localhost:8000
spring.ai.vectorstore.chroma.collection-name=rag-documentModels
spring.ai.vectorstore.chroma.initialize-schema=true
# Alternative Vector Store - Qdrant (if using instead of Chroma)
#spring.ai.vectorstore.qdrant.url=http://localhost:6333
#spring.ai.vectorstore.qdrant.collection-name=rag-documentModels
#spring.ai.vectorstore.qdrant.initialize-schema=true
# Redis Configuration (for caching)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.ai.rag_demo=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.elasticsearch=INFO
